name: VALORA CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://localhost:5432/valora_test
      SECRET_KEY: test-secret-not-for-production
      CORS_ORIGINS: '["http://localhost:5173"]'
      PYTHONPATH: backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r backend/requirements.txt -c backend/constraints.txt

    - name: Start native disposable PostgreSQL database
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql
        sudo systemctl start postgresql
        db_password=$(openssl rand -hex 24)
        echo "::add-mask::$db_password"
        sudo -u postgres psql -v ON_ERROR_STOP=1 --set=role_password="$db_password" <<'SQL'
        CREATE ROLE valora_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'role_password';
        CREATE DATABASE valora_ci_test OWNER valora_ci;
        SQL
        printf 'DATABASE_URL=postgresql+asyncpg://valora_ci:%s@127.0.0.1:5432/valora_ci_test\n' "$db_password" >> "$GITHUB_ENV"
        printf 'TEST_DATABASE_URL=postgresql+asyncpg://valora_ci:%s@127.0.0.1:5432/valora_ci_test\n' "$db_password" >> "$GITHUB_ENV"

    - name: Run backend tests including database integration
      run: pytest backend/tests -q

    - name: Verify committed OpenAPI contract
      run: |
        python -m app.cli export-openapi
        git diff --exit-code -- docs/openapi.json

    - name: Compile backend application
      run: python -m compileall -q backend/app

    - name: Generate offline Alembic SQL
      working-directory: backend
      run: python -m alembic upgrade head --sql

    - name: Run code check (Syntax/Linting)
      run: |
        python -m pip install -c backend/constraints.txt flake8
        flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend-build-and-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Build frontend
      working-directory: frontend
      run: npm run build
    - name: Run frontend unit tests
      working-directory: frontend
      run: npm test
