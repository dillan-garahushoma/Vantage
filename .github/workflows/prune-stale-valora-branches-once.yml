name: One-time VALORA branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-stale-valora-branches-once.yml"

permissions:
  contents: write

jobs:
  prune-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed stale VALORA branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          stale_branches=(
            "codex/valora-experience-completion"
            "codex/valora-experience-redesign"
            "codex/valora-handoff"
            "codex/valora-mockup-faithful-ui"
          )

          for branch in "${stale_branches[@]}"; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$branch")"

            case "$status" in
              204)
                echo "Deleted stale branch: $branch"
                ;;
              404)
                echo "Branch already absent: $branch"
                ;;
              *)
                echo "Could not delete $branch (HTTP $status):"
                cat "$response_file"
                rm -f "$response_file"
                exit 1
                ;;
            esac
            rm -f "$response_file"
          done
