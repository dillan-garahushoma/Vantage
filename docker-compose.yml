services:
  db:
    image: postgres:15-alpine
    container_name: valora_db
    restart: always
    environment:
      POSTGRES_USER: valora_user
      POSTGRES_PASSWORD: valora_password
      POSTGRES_DB: valora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: valora_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      # Note: We use 'db' here instead of 'localhost' because Docker handles the internal network routing!
      - DATABASE_URL=postgresql+asyncpg://valora_user:valora_password@db:5432/valora_db
      - SECRET_KEY=super-secret-development-key-change-in-prod
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    container_name: valora_frontend
    restart: always
    working_dir: /app
    ports:
      - "4173:4173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  postgres_data:
